<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cbe7f9">
  <title>Tidepool Notes & Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Log In / Sign Up Gate Screen -->
  <section class="cloud-gate" id="cloud-gate" aria-labelledby="auth-title">
    <div class="auth-wrapper">
      <h1 class="auth-header-title">TIDEPOOL: NOTES & SOCIAL</h1>
      
      <div class="auth-card">
        <div class="auth-avatar-circle" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" stroke="#8ec5fc" stroke-width="8"/>
            <circle cx="50" cy="38" r="18" fill="#8ec5fc"/>
            <path d="M20 80C20 63.4315 33.4315 50 50 50C66.5685 50 80 63.4315 80 80V84H20V80Z" fill="#8ec5fc"/>
          </svg>
        </div>

        <div class="auth-form-container">
          <h2 id="auth-title">Welcome to your own Safe Space</h2>
          
          <form id="sign-in-form" class="sign-in-form">
            <div class="input-group">
              <label for="sign-in-email" class="sr-only">Username or Email</label>
              <input id="sign-in-email" type="text" autocomplete="username" placeholder="username/email address" required>
            </div>

            <div class="input-group">
              <label for="sign-in-password" class="sr-only">Password</label>
              <input id="sign-in-password" type="password" autocomplete="current-password" placeholder="password" required>
            </div>

            <button id="sign-in-button" type="submit" class="auth-submit-btn">Log In</button>
          </form>

          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>

          <button id="toggle-auth-mode" type="button" class="auth-toggle-btn">
            New here? tap this button to Sign Up
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Main App Shell Interface -->
  <div class="app-shell" id="app-shell" hidden>
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#" aria-label="Tidepool Notes home">
        <span>Tidepool</span>
        <span class="brand-sub">Notes</span>
      </a>
      
      <nav class="primary-nav" id="primary-nav">
        <button class="nav-item is-active" type="button" data-view="feed" id="nav-feed-btn">
          <span class="nav-icon">🏠</span> FEED
        </button>
        <button class="nav-item" type="button" data-view="discover">
          <span class="nav-icon">🔍</span> DISCOVER
        </button>
        <button class="nav-item" type="button" data-view="friends">
          <span class="nav-icon">👥</span> FRIENDS <span class="nav-count" id="friend-count" hidden></span>
        </button>
        <button class="nav-item" type="button" data-view="chats">
          <span class="nav-icon">✉️</span> CHATS <span class="nav-count" id="chat-count" hidden></span>
        </button>
        <button class="nav-item" type="button" data-view="profile">
          <span class="nav-icon">👤</span> PROFILE
        </button>
        <button class="nav-item" type="button" data-view="notes">
          <span class="nav-icon">📋</span> NOTES
        </button>
      </nav>

      <!-- Sidebar Controls -->
      <div class="sidebar-extra">
        <button class="new-note-button" id="new-note" type="button">+ New Note</button>
        <div class="sort-box">
          <label for="sort-notes-select" class="sort-label">Sort Notes:</label>
          <select id="sort-notes-select" class="sort-select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title-asc">Title (A-Z)</option>
            <option value="title-desc">Title (Z-A)</option>
          </select>
        </div>
        <label class="search-box">
          <input id="search" type="search" placeholder="Find a note..." autocomplete="off">
        </label>
        <div class="note-list" id="note-list"></div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Top Header Bar -->
      <header class="topbar">
        <div class="breadcrumb">
          <span id="breadcrumb-section">Community</span>
          <span class="breadcrumb-slash">/</span>
          <strong id="breadcrumb-title">A space for you to think</strong>
        </div>
        <div class="topbar-actions">
          <button class="sign-out-button" id="sign-out" type="button">Sign Out</button>
          <button class="user-avatar-btn" type="button" aria-label="User profile">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="18" cy="18" r="16" stroke="#8bc4f8" stroke-width="2.5" fill="#cfe8fc"/>
              <circle cx="18" cy="14" r="6" fill="#8bc4f8"/>
              <path d="M8 29C8 23.4772 12.4772 19 18 19C23.5228 19 28 23.4772 28 29V30H8V29Z" fill="#8bc4f8"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Social View: Public Feed Panel -->
      <section class="social-view feed-view" id="feed-view" data-view-panel="feed">
        <div class="social-heading">
          <div class="heading-text">
            <h1>Calm yourself</h1>
            <p>Drop your thoughts and breathe....</p>
          </div>
          <button class="compose-jump" id="compose-jump" type="button">+ New Post</button>
        </div>

        <form class="post-composer" id="post-form" hidden>
          <textarea id="post-caption" maxlength="280" rows="3" placeholder="Drop your thoughts and breathe..."></textarea>
          <div class="composer-bottom">
            <input id="post-photo" type="file" accept="image/*" hidden>
            <button class="composer-picture" id="choose-post-photo" type="button">Add photo</button>
            <button class="publish-button" id="publish-post" type="submit">Post</button>
          </div>
        </form>

        <div class="feed-list" id="feed-list">
          <div class="mock-post-card"></div>
          <div class="mock-post-card"></div>
        </div>
      </section>

      <!-- Note Editor View Panel -->
      <section class="editor-wrap app-view" id="notes-view" data-view-panel="notes" hidden>
        <div class="editor-meta">
          <div class="date-label"><span id="note-date">TODAY</span> / FIELD NOTES</div>
          <div class="note-actions">
            <button class="save-button" id="save-note" type="button">Save</button>
            <button class="icon-button" id="pin-note" type="button" title="Pin Note">📌</button>
            <button class="icon-button" id="delete-note" type="button" title="Delete Note">🗑️</button>
          </div>
        </div>
        <input class="note-title" id="note-title" type="text" placeholder="Untitled note">
        <div class="editor-toolbar">
          <button class="format-button" type="button" data-command="bold"><b>B</b></button>
          <button class="format-button" type="button" data-command="italic"><i>I</i></button>
          <button class="format-button" type="button" data-command="underline"><u>U</u></button>
        </div>
        <div class="editor-content" id="editor-content" contenteditable="true"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script src="social.js"></script>
</body>
</html>
